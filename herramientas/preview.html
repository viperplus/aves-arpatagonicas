<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Preview · aves 2.5D</title>
  <style>
    html, body { margin: 0; min-height: 100%; overflow: hidden;
      background: #dfe8ee; font-family: system-ui, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; }
    #jaula {
      display: grid;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr);
      width: 100vw; height: 100vh;
      gap: 10px; padding: 10px;
      box-sizing: border-box;
    }
    .celda {
      display: flex; flex-direction: column;
      background: #f6efdf;
      border-radius: 10px;
      overflow: hidden;
      min-height: 0;
    }
    .celda img {
      flex: 1; min-height: 0;
      width: 100%; object-fit: contain;
      padding: 6px; box-sizing: border-box;
    }
    .celda .et {
      text-align: center;
      font: 700 15px system-ui; color: #16323f;
      padding: 4px 0 7px; letter-spacing: .3px;
    }
    body.solo #jaula { grid-template: 1fr; }
    body.solo .celda img { padding: 14px; }
    body.solo .celda .et { font-size: 20px; }
  </style>
</head>
<body>
  <div id="jaula"></div>

  <script src="../js/datos.js"></script>
  <script>
    (function () {
      var m = /[?&]ave=([a-z]+)/i.exec(location.search);
      var solo = m ? (AVES.find(function (a) { return a.id === m[1]; }) || null) : null;
      var lista = solo ? [solo] : AVES;
      if (solo) document.body.classList.add("solo");

      var jaula = document.getElementById("jaula");
      var faltan = lista.length;
      window.__listo = false;

      lista.forEach(function (ave) {
        var c = document.createElement("div");
        c.className = "celda";
        var img = document.createElement("img");
        img.alt = ave.nombre;
        img.onload = img.onerror = function () {
          if (--faltan <= 0) window.__listo = true;
        };
        img.src = "../assets/ave-25d/" + ave.id + ".png";
        var et = document.createElement("div");
        et.className = "et";
        et.textContent = ave.nombre;
        c.appendChild(img);
        c.appendChild(et);
        jaula.appendChild(c);
      });

      if (faltan <= 0) window.__listo = true;
    })();
  </script>
</body>
</html>
