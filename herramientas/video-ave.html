<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Video · ave 2.5D</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #efe5cf; }
    canvas { display: block; width: 512px; height: 512px; }
  </style>
</head>
<body>
  <canvas id="cv" width="512" height="512"></canvas>

  <script src="../js/datos.js"></script>
  <script src="../js/aves25d.js"></script>
  <script>
    (function () {
      var m = /[?&]ave=([a-z]+)/i.exec(location.search);
      var id = m ? m[1] : "chimango";
      var ave = AVES.find(function (a) { return a.id === id; }) || AVES[0];
      window.__especie = ave.id;
      window.__listo = false;
      window.__grabando = false;

      var cv = document.getElementById("cv");
      var ctx = cv.getContext("2d");
      var fy = Aves25D.MEDIDAS[ave.id] || 0.84;
      var PPU = 768;                 /* px por unidad (encuadre propio) */
      var Lpx = 430;                 /* lado del ave dentro del video 512 */
      var cx = 256, pies = 430;
      var t = 0, ultimo = null, corriendo = false;

      var img = new Image();
      img.onload = function () {
        window.__listo = true;
        requestAnimationFrame(bucle);
      };
      img.onerror = function () { window.__error = "sin corte " + ave.id; };
      img.src = "../assets/ave-25d/" + ave.id + ".png";

      function estado(tt) {
        var c = tt % 6;
        var salto = c < 0.45 ? Math.sin(Math.PI * c / 0.45) * 0.018 : 0;
        return {
          rot: Math.sin(tt * (Math.PI / 3)) * 0.045,
          dy: Math.sin(tt * (2 * Math.PI / 3)) * 0.005 + salto
        };
      }

      function pintar() {
        var e = estado(t);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#efe5cf";
        ctx.fillRect(0, 0, 512, 512);

        /* sombra de contacto (no gira con el ave) */
        ctx.save();
        ctx.translate(cx + 8, pies + 2);
        ctx.scale(1, 0.42);
        ctx.beginPath();
        ctx.arc(0, 0, 0.09 * PPU, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(0,0,0,0.16)";
        ctx.fill();
        ctx.restore();

        /* ave: pivote en los pies, balanceo + salto */
        ctx.save();
        ctx.translate(cx, pies);
        ctx.rotate(e.rot);
        ctx.drawImage(img, -Lpx / 2, -fy * Lpx - e.dy * PPU, Lpx, Lpx);
        ctx.restore();
      }

      function bucle(ts) {
        if (ultimo === null) ultimo = ts;
        var dt = Math.min(0.05, (ts - ultimo) / 1000);
        ultimo = ts;
        if (corriendo) t += dt;
        pintar();
        requestAnimationFrame(bucle);
      }

      /* Graba exactamente 6 s desde t=0 (ciclo completo) y devuelve base64. */
      window.__grabar = function () {
        return new Promise(function (resolve) {
          try {
            var tipos = [
              "video/mp4;codecs=avc1.42E01E", "video/mp4",
              "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"
            ];
            var mime = null;
            for (var i = 0; i < tipos.length; i++) {
              if (window.MediaRecorder &&
                  MediaRecorder.isTypeSupported(tipos[i])) { mime = tipos[i]; break; }
            }
            if (!mime) return resolve({ error: "MediaRecorder sin formato" });

            var stream = cv.captureStream(30);
            var rec = new MediaRecorder(stream,
              { mimeType: mime, videoBitsPerSecond: 1200000 });
            var trozos = [];
            rec.ondataavailable = function (ev) {
              if (ev.data && ev.data.size) trozos.push(ev.data);
            };
            rec.onerror = function () { resolve({ error: "error de MediaRecorder" }); };
            rec.onstop = function () {
              stream.getTracks().forEach(function (tr) { tr.stop(); });
              var blob = new Blob(trozos, { type: mime });
              var fr = new FileReader();
              fr.onload = function () {
                resolve({ mime: mime, especie: window.__especie,
                  datos: fr.result.split(",")[1] });
              };
              fr.readAsDataURL(blob);
            };

            t = 0;
            corriendo = true;
            window.__grabando = true;
            rec.start();
            setTimeout(function () {
              window.__grabando = false;
              corriendo = false;
              if (rec.state !== "inactive") rec.stop();
            }, 6000);
          } catch (e2) {
            resolve({ error: String(e2 && e2.message || e2) });
          }
        });
      };
    })();
  </script>
</body>
</html>
